<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Admin</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS v5.2.1 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <style>
      body {
        background-color: #f8f9fa;
      }

      .login-container {
        background-color: #343a40; /* Dark background color */
        color: #fff; /* Text color */
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.1);
        width: 50%; /* 60% of screen width */
        height: 60vh; /* 60% of viewport height */
      }

      .form-control {
        border-radius: 5px;
      }

      .btn-primary {
        background-color: #007bff; /* Primary button color */
        border-color: #007bff;
      }

      .btn-primary:hover {
        background-color: #0056b3; /* Hover color */
        border-color: #0056b3;
      }

      body {
        background-image: url("../../static/images/adminbg.jpg");
      }
    </style>
  </head>
  <body>
    <div
      class="container d-flex justify-content-center align-items-center vh-100"
    >
      <div class="login-container" style="background-color: #10002b">
        <h2 class="text-center m-4">ADMIN LOGIN</h2>

        <form action="../admin_Login" method="POST">
          <div class="m-5 justify-content-center text-center">
            <label for="aduname" class="form-label">Username</label>
            <input
              type="text"
              class="form-control"
              id="aduname"
              name="aduname"
              required
            />
          </div>
          <div class="m-5 justify-content-center text-center">
            <label for="adpass" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="adpass"
              name="adpass"
              required
            />
          </div>
          <div class="text-center m-5">
            <button
              type="submit"
              class="btn btn-lg btn-primary btn-block m-2"
              style="background-color: #6a00f4"
            >
              Login
            </button>
            <button
              type="reset"
              class="btn btn-lg btn-danger btn-block m-2"
              style="background-color: #9d4edd"
            >
              Reset
            </button>
          </div>
        </form>
        <p
          class="large mb-0 m-5 text-white-50 justify-content-center text-center"
        >
          Return
          <a class="text-reset" href="/">Back</a>.
        </p>
      </div>
    </div>

    <!-- Bootstrap JavaScript Libraries -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
      integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
