<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Send Email</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS v5.2.1 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light">
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="../adlanding">Admin Dashboard</a>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link" href="../calldisplay">Call Requests</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="../userdisplay">Users</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="../sendemail">Send Email</a>
              </li>
            </ul>
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="../adlogout">Logout</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <div class="container-fluid py-5 text-dark">
        <h1 class="mb-4">Send Email</h1>
        <form action="/send_mail" method="post">
          {% if professional %}
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input
              type="text"
              class="form-control"
              id="name"
              name="name"
              value="{{ professional.name }}"
              readonly
            />
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              value="{{ professional.email }}"
              readonly
            />
          </div>
          {% endif %}
          <div class="mb-3">
            <label for="datetime" class="form-label">Date and Time</label>
            <input
              type="datetime-local"
              class="form-control"
              id="datetime"
              name="datetime"
              required
            />
          </div>
          <div class="mb-3">
            <label for="description" class="form-label"
              >Additional Description</label
            >
            <input
              type="text"
              class="form-control"
              id="description"
              name="description"
            />
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea
              class="form-control"
              id="message"
              name="message"
              rows="3"
              required
            ></textarea>
          </div>
          <button type="submit" class="btn btn-success btn-lg m-1">
            Submit
          </button>
          <button type="reset" class="btn btn-secondary btn-lg m-1">
            Reset
          </button>
        </form>
      </div>
    </main>
    <!-- Bootstrap JavaScript Libraries -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
      integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
