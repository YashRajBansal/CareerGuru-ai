<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS v5.2.1 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <style>
      body {
        background-color: #f8f9fa;
      }
      .form-control {
        border-color: #1d3557;
      }
      .form-label {
        color: black;
        font-weight: 700;
        font-size: larger;
      }

      .custom-container {
        width: 50%;
        background-color: #fdf0d5;
      }
    </style>
  </head>

  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-light bg-light" id="mainNav" style="height: 65px;">
        <div class="container px-1 px-lg-1">
            <a class="navbar-brand" href="/home" style="font-weight: 900">CAREER GURU</a>
            <!-- Added the chatbot and guidance link here -->
            <a class="nav-link m-5" href="/chatbot1">Chatbot</a>
            <a class="nav-link" href="/professional">Professional Guidance</a>
            <!-- End of added links -->
            <button class="navbar-toggler navbar-toggler-right" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                Menu
                <i class="fas fa-bars"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <img src="{{ url_for('static', filename='images/user-1.jpg') }}" alt="User" width="35" height="35" class="rounded-circle">
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item" href="/profile">Profile</a></li>
                            <!-- <li><a class="dropdown-item" href="/tasks">Tasks</a></li> -->
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="/logout">Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    </header>
    <div class="bg-dark py-5">
      <div class="container bg-light p-4 p-md-5 rounded custom-container">
        <div class="row justify-content-center">
          <div class="col-lg-8">
            <h2 class="m-4 text-center">PROFESSIONAL GUIDENCE FORM</h2>
            <form action="/professional" method="POST">
              <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="name"
                  name="name"
                  placeholder="Enter your name"
                />
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  name="email"
                  placeholder="Enter your email"
                />
              </div>
              <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input
                  type="tel"
                  class="form-control"
                  id="phone"
                  name="phone"
                  placeholder="Enter your phone number"
                />
              </div>
              <div class="mb-3">
                <label for="occupation" class="form-label"
                  >Occupation/Profession</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="occupation"
                  name="occupation"
                  placeholder="Enter your occupation/profession"
                />
              </div>
              <div class="mb-3">
                <label for="industry" class="form-label">Industry</label>
                <input
                  type="text"
                  class="form-control"
                  id="industry"
                  name="industry"
                  placeholder="Enter your industry"
                />
              </div>
              <div class="mb-3">
                <label for="company" class="form-label">Company</label>
                <input
                  type="text"
                  class="form-control"
                  id="company"
                  name="company"
                  placeholder="Enter your company"
                />
              </div>
              <div class="mb-3">
                <label for="interest" class="form-label"
                  >Area of Interest</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="interest"
                  name="interest"
                  placeholder="Enter your area of interest"
                />
              </div>
              <div class="mb-3">
                <label for="challenges" class="form-label"
                  >Current Challenges</label
                >
                <textarea
                  class="form-control"
                  id="challenges"
                  name="challenges"
                  rows="3"
                  placeholder="Enter your current challenges"
                ></textarea>
              </div>
              <div class="mb-3">
                <label for="outcome" class="form-label">Desired Outcome</label>
                <textarea
                  class="form-control"
                  id="outcome"
                  name="outcome"
                  rows="3"
                  placeholder="Enter your desired outcome"
                ></textarea>
              </div>
              <div class="mb-3">
                <label for="availability" class="form-label"
                  >Availability</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="availability"
                  name="availability"
                  placeholder="Enter your availability"
                />
              </div>
              <div class="mb-3">
                <label for="comments" class="form-label"
                  >Additional Comments</label
                >
                <textarea
                  class="form-control"
                  id="comments"
                  name="comments"
                  rows="3"
                  placeholder="Enter any additional comments"
                ></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Submit</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <!-- place footer here -->
    </footer>
    <!-- Bootstrap JavaScript Libraries -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
      integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
