<!DOCTYPE html>
<html lang="en">
<head>
    <title>Chatbot UI</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Bootstrap CSS v5.3.2 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
        crossorigin="anonymous"
    />
    <style>
        body {
            background-color: #f8f9fa; /* Set a light grey background */
        }

        .navbar-container {
            background-color: #343a40; /* Dark grey for the navbar */
            color: #ffffff; /* White text on the navbar */
        }

        .chat-container {
            height: 80vh; /* Increased height for chat container */
            width: 60%; /* Use at least 60% of the viewport width */
            margin: 5vh auto; /* Center the chat container vertically and horizontally */
            padding: 20px;
            border-radius: 10px;
            background-color: #ffffff; /* White background for chat container */
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1); /* Subtle shadow effect */
            display: flex;
            flex-direction: column;
        }

        .messages {
            flex-grow: 1; /* Allow this div to grow and take available space */
            overflow-y: auto; /* Enable scrolling for overflow */
            margin-bottom: 10px; /* Space between messages and input field */
        }

        #message {
            width: calc(100% - 90px); /* Adjusted width */
        }

        .btn-primary {
            margin-top: 10px;
        }

        .message {
            margin: 10px 0; /* Space between messages */
            padding: 10px;
            border-radius: 5px;
            word-wrap: break-word; /* Wrap long words */
        }

        .user-message {
            background-color: #d1ecf1; /* Light blue background for user messages */
            align-self: flex-end; /* Align user messages to the right */
        }

        .bot-message {
            background-color: #e2e3e5; /* Light gray background for bot messages */
            align-self: flex-start; /* Align bot messages to the left */
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light" id="mainNav" style="height: 65px">
        <div class="container px-1 px-lg-1">
            <a class="navbar-brand py-2" href="/home" style="font-weight: 900">CAREER GURU</a>
            <a class="nav-link ms-5" href="/chatbot">Chatbot</a>
            <a class="nav-link ms-5" href="/professional">Professional Guidance</a>
            <button class="navbar-toggler navbar-toggler-right" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                Menu
                <i class="fas fa-bars"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <img src="{{ url_for('static', filename='images/user-1.jpg') }}" alt="User" width="35" height="35" class="rounded-circle" />
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item" href="/profile">Profile</a></li>
                            <li><a class="dropdown-item" href="/tasks">Tasks</a></li>
                            <li><hr class="dropdown-divider" /></li>
                            <li><a class="dropdown-item" href="/logout">Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Chat Container -->
    <div class="container d-flex justify-content-center align-items-center">
        <div class="chat-container">
            <div class="messages">
                {% if user_input %}
                <div class="message user-message">
                    <strong>YOU:</strong> {{ user_input }}
                </div>
                {% endif %}
                {% if bot_response %}
                <div class="message bot-message">
                    <strong>CHATBOT:</strong> {{ bot_response }}
                </div>
                {% endif %}
            </div>
            <div class="form-container">
                <form action="/chatbot1" method="post">  <!-- Ensure this matches your Flask route -->
                    <div class="form-group">
                        <label for="message">MESSAGE:</label>
                        <input
                            type="text"
                            name="message"
                            id="message"
                            class="form-control"
                            required
                        />
                    </div>
                    <button type="submit" class="btn btn-primary mt-3">SEND</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JavaScript Libraries -->
    <script
        src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
        integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
        crossorigin="anonymous"
    ></script>
</body>
</html>
